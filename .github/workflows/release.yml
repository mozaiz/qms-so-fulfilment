name: Release

# Push a tag and ready-to-copy archives land on the release:
#
#   git tag v0.3.0
#   git push origin v0.3.0
#
# Each archive contains everything an outlet needs — the app, the installers,
# the static assets and the docs. No compiled binaries, no build step.
#
# Can also be run by hand from the Actions tab to produce a downloadable
# artifact without creating a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      label:
        description: "Version label (e.g. v0.3.0)"
        required: true
        default: "v0.0.0-dev"

permissions:
  contents: write

jobs:
  package:
    name: Build outlet archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag and the code inside it must agree. Publishing v0.8.4 with an app
      # that reports 0.8.3 means everyone who pins QMS_REF=v0.8.4 gets a version
      # line that contradicts what they asked for — and the update bar compares
      # those strings, so it misbehaves too. Cheap to check, invisible otherwise.
      - name: The tag and the code must agree
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "not a tag build — skipping"
            exit 0
          fi
          CODE=$(sed -n 's/.*version="\([0-9][^"]*\)".*/\1/p' app.py | head -1)
          JS=$(sed -n 's/.*var APP_VER = "\([^"]*\)".*/\1/p' static/js/app.js | head -1)
          echo "tag: $TAG   app.py: $CODE   app.js: $JS"
          test "$TAG" = "v$CODE" || { echo "::error::tag $TAG does not match app.py version $CODE — bump the version before tagging"; exit 1; }
          test "$JS" = "$CODE" || { echo "::error::app.js says $JS but app.py says $CODE"; exit 1; }

      - name: Work out the version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "label=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "label=${{ github.event.inputs.label }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build archives
        run: python3 deploy/package.py "${{ steps.v.outputs.label }}"

      # Prove the archive is actually installable before it is published:
      # unpack it somewhere clean, install the deps, boot the server and hit it.
      - name: Verify the archive installs and boots
        run: |
          set -euo pipefail
          LABEL="${{ steps.v.outputs.label }}"
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          tar xzf "qms-${LABEL}.tar.gz" -C /tmp/verify
          cd "/tmp/verify/qms-${LABEL}"

          python -m venv venv
          ./venv/bin/pip install --quiet -r requirements.txt

          QMS_DB=/tmp/verify/verify.db ./venv/bin/uvicorn app:app \
            --host 127.0.0.1 --port 8123 > /tmp/verify.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8123/api/health
          curl -sf http://127.0.0.1:8123/api/network
          curl -sf http://127.0.0.1:8123/ -o /dev/null
          curl -sf http://127.0.0.1:8123/vendor/zxing.min.js -o /dev/null
          echo "archive installs, boots and serves"

      - name: Show what was built
        run: cat SHA256SUMS.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            qms-*.zip
            qms-*.tar.gz
            SHA256SUMS.txt
          generate_release_notes: true

      - name: Upload as a build artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: qms-archives
          path: |
            qms-*.zip
            qms-*.tar.gz
            SHA256SUMS.txt
