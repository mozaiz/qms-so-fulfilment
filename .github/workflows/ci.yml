name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Test suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is NOT padding. macOS ships Python 3.9.6 with the Command Line
        # Tools, so it is the interpreter a Mac without Homebrew actually runs.
        # `int | None` in a Pydantic model is fine on 3.10+ and a runtime
        # TypeError on 3.9 — modelling it here is the only thing that catches
        # that class of bug, and 3.12 alone never will.
        python: ["3.9", "3.12"]
        port: [8199, 8299]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Installing dependencies proves nothing about whether the code runs.
      # This is the check whose absence let a build that could not start reach a
      # store machine with a green installer.
      - name: The app must import on this Python
        run: |
          python -c "import app; print('app imports on', __import__('sys').version.split()[0])"

      - name: Syntax check
        run: |
          python -m compileall -q app.py seed_demo.py test_flow.py make_qr_card.py
          python -c "import ast,sys; ast.parse(open('app.py').read())"

      # Start the server, seed a known state, then drive the real HTTP API.
      # The important assertion is the concurrent-claim one: fire 4 simultaneous
      # claims at the same SO and require exactly one winner. That invariant is
      # the reason this app uses SQLite instead of a CSV file.
      # QMS_PORT is threaded through to the server and every suite below.
      # The two matrix jobs share a runner's port space, so they cannot both be
      # 8099 — and worse, a stray listener from an earlier step makes a suite
      # fail in a way that looks like an app bug.
      - name: Run API test suite
        env:
          QMS_PORT: ${{ matrix.port }}
        run: |
          set -e
          uvicorn app:app --host 127.0.0.1 --port "$QMS_PORT" > /tmp/qms.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:"$QMS_PORT"/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:"$QMS_PORT"/api/health | tee /dev/stderr

          python seed_demo.py
          python test_flow.py http://127.0.0.1:"$QMS_PORT"

      # The installer, the data-survives-a-restart guarantee, and the
      # install/uninstall lifecycle. These are the promises a store is told to
      # rely on, so they are asserted rather than described.
      - name: Installer, persistence and lifecycle suites
        env:
          QMS_PORT: ${{ matrix.port }}
        run: |
          set -e
          python deploy/test_frontend.py
          python deploy/test_readme.py
          python deploy/test_https.py
          python deploy/test_guide.py
          # The release archives ship whatever this produces. A file missing here
          # is an outlet downloading an app that cannot boot, and it would only be
          # discovered at tag time — so build the archive on every push.
          python deploy/package.py ci-test
          bash deploy/test_install_linux.sh
          python deploy/test_persistence.py
          python deploy/test_lifecycle.py

      - name: Server log on failure
        if: failure()
        run: tail -60 /tmp/qms.log || true

  # ---------------------------------------------------------------------------
  smoke:
    name: Server starts with a clean database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fresh-database boot
        run: |
          set -e
          export QMS_DB="$RUNNER_TEMP/fresh.db"
          uvicorn app:app --host 127.0.0.1 --port 8111 > /tmp/smoke.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8111/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8111/api/health
          curl -sf http://127.0.0.1:8111/api/network
          # every role must be able to sign in on a brand-new database
          for role in scanner backstore manager; do
            curl -sf -X POST http://127.0.0.1:8111/api/login \
              -H 'Content-Type: application/json' -d "{\"role\":\"$role\"}" >/dev/null
          done
          for n in 1 2 3 4; do
            curl -sf -X POST http://127.0.0.1:8111/api/login \
              -H 'Content-Type: application/json' \
              -d "{\"role\":\"pos\",\"pos_number\":$n}" >/dev/null
          done
          echo "all roles signed in on a fresh database"
